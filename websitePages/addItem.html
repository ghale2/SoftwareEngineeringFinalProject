<html lang="en">
  <link rel="stylesheet" href="../websiteFiles/styles.css" />
  <script defer src="../websiteFiles/scripts.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Item</title>
<h1>Add Item to Pantry</h1>

<form id="itemForm">
    <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Enter ingredient or item name" required /><br>
  <label for="quantity">Quantity:</label>
  <input type="number" id="quantity" placeholder="Enter quantity" required /><br>
  <label for="expiration">Expiration date. Enter 01 for day if not shown </label>
  <input type="date" id="expiration"/><br>
  <label for="category">Category:</label>
  <select id="category" required>
    <option value="">Select a category</option>
    <option value="produce">Produce</option>
    <option value="dairy">Dairy</option>
    <option value="meat">Meat</option>
    <option value="grains">Grains</option>
    <option value="other">Other</option>
  </select><br>
  <label for="notes">Notes:</label>
  <textarea id="notes" placeholder="Enter notes"></textarea><br>
  <label for="isOpened">Opened:</label>
    <input type="checkbox" id="isOpened"/><br>
    <button id="submit" type="submit">Add Item</button>
</form>



<label><br><strong>Current Pantry Contents</strong></label>
<ul id="pantryList"></ul>

<button onclick="window.location.href='../index.html'">Back to Home</button>
<div id="itemConf" class="hidden">Item added to pantry!</div>
<div id="cookieSaveConf" class="hidden">Pantry Saved!</div>
<div id="cookieLoadConf" class="hidden">Pantry Loaded!</div>
