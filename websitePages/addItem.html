<html lang="en">
  <link rel="stylesheet" href="../websiteFiles/styles.css" />
  <script defer src="../websiteFiles/scripts.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Item</title>
<h1>Add Item to Pantry</h1>
<form id="itemForm">
  <input type="text" id="name" placeholder="Enter ingredient or item name" />
  <input type="number" id="quantity" placeholder="Enter quantity" />
  <input type="date" id="expiration" placeholder="Enter expiration date format: YYYY-MM-DD. Enter 01 for day if not shown" />
  <select id="category">
    <option value="">Select a category</option>
    <option value="produce">Produce</option>
    <option value="dairy">Dairy</option>
    <option value="meat">Meat</option>
    <option value="grains">Grains</option>
    <option value="other">Other</option>
  </select>
  <textarea id="notes" placeholder="Enter notes"></textarea>
  <label>
    <input type="checkbox" id="isOpened"/>Opened</label>
</form>
<button id="addButton">Add Item</button>
<button onclick="window.location.href='../index.html'">Back to Home</button>
<div id="confirmation" class="hidden">Item added to pantry!</div>
